{% extends 'base.html' %}

{% block content %}
<h2>Adicionar uma Lenda</h2>
<p>Compartilhe sua própria lenda brasileira.</p>
{% if error %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endif %}
<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="title" class="form-label">Título da Lenda</label>
        <input type="text" class="form-control" id="title" name="titulo" required>
    </div>
    <div class="mb-3">
        <label for="author" class="form-label">Nome do Autor</label>
        <input type="text" class="form-control" id="author" name="autor" required>
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Data de Publicação</label>
        <input type="date" class="form-control" id="date" name="data_publicacao" required>
    </div>
    <div class="mb-3">
        <label for="content" class="form-label">Conteúdo da Lenda</label>
        <textarea class="form-control" id="content" name="conteudo" rows="10" required></textarea>
    </div>
    <div class="mb-3">
        <label for="imagem" class="form-label">Imagem da Lenda</label>
        <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*" required>
    </div>
    <button type="submit" class="btn btn-outline-primary">Enviar Lenda</button>
</form>
{% endblock %}
