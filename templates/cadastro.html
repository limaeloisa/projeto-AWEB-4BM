{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="card shadow-lg p-4"
         style="width: 100%; max-width: 420px;
                background-color: rgba(255,255,255,0.88);
                border-radius: 15px;">

        <h3 class="text-center fw-bold mb-2 text-dark">Criar Conta</h3>
        <p class="text-center text-muted mb-4">Preencha os dados abaixo</p>

        {% if erro %}
        <div class="alert alert-danger text-center">
            {{ erro }}
        </div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" name="nome"
                       class="form-control"
                       placeholder="Digite seu nome"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email"
                       class="form-control"
                       placeholder="Digite seu email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha"
                       class="form-control"
                       placeholder="Crie uma senha"
                       required>
            </div>

            <div class="d-grid mt-4">
                <button class="btn btn-purple btn-lg">
                    Cadastrar
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">
                Já tem conta?
                <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">
                    Entrar
                </a>
            </small>
        </div>

    </div>

</div>
{% endblock %}
