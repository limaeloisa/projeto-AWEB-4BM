<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}
<h1>{{ post.titulo }}</h1>
<p class="text-muted">Publicado em {{ post.data }}</p>

<img src="{{ url_for('static', filename='img/uploads/' ~ post.imagem) }}" class="img-fluid mb-4">

<p>{{ post.conteudo }}</p>

<a href="/" class="btn btn-secondary mt-3">Voltar</a>
{% endblock %}
</body>
</html>
