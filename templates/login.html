{% extends 'base.html' %}

{% block content %}
<h2>Login</h2>

{% if erro %}
<div class="alert alert-danger">{{ erro }}</div>
{% endif %}

<form method="post">
    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Senha</label>
        <input type="password" name="senha" class="form-control" required>
    </div>

    <button class="btn btn-primary">Entrar</button>
</form>
{% endblock %}
