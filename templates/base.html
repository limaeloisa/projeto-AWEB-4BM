<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórias Que o Tempo Contou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-light text-dark p-3 border-bottom">
        <div class="container">
            <h1 class="h4">Portal das Lendas Brasileiras</h1>
            <nav>
                <a href="{{ url_for('index') }}" class="text-decoration-none me-3">Início</a>
                <a href="{{ url_for('lendas') }}" class="text-decoration-none me-3">Lendas</a>
                <a href="{{ url_for('add') }}" class="text-decoration-none">Adicionar Lenda</a>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-light text-muted p-3 text-center border-top mt-auto">
        <p>&copy; 2026 Portal das Lendas Brasileiras. Todos os direitos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
